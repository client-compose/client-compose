name: kotlin

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "spec/**"
      - "conformance/client/**"
      - "clients/kotlin/**"
      - "codegen/test/**"
      - ".github/workflows/kotlin.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

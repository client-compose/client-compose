name: codegen

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "codegen/**"
      - "scripts/build-codegen-binaries.sh"
      - "examples/**"
      - "shared/typescript/**"
      - "composers/go/**"
      - ".github/workflows/codegen.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the compat check compares with the PR's base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5 # gofmt for Go output
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile
      - name: Generated files are up to date
        run: node codegen/cli.ts --check codegen/test/fixtures/client-compose.codegen.json conformance/composer/client-compose.codegen.json examples/todo/client-compose.codegen.json
      - run: node --test "codegen/test/*.test.ts"
      - name: Go golden output compiles and decodes
        working-directory: codegen/test/golden/go
        run: go vet ./... && go test ./...
      - name: Island manifests have no breaking changes without a version bump
        if: github.event_name == 'pull_request'
        run: node codegen/cli.ts compat examples/todo/client-compose.codegen.json --base "origin/$GITHUB_BASE_REF"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Standalone binary builds and matches the Node CLI
        run: |
          TARGETS=linux-x64 BUN=bun scripts/build-codegen-binaries.sh build/codegen-binaries
          bin=build/codegen-binaries/client-compose-codegen-linux-x64
          $bin --version
          $bin --check codegen/test/fixtures/client-compose.codegen.json examples/todo/client-compose.codegen.json
          $bin compat examples/todo/client-compose.codegen.json --base-dir examples/todo/islands

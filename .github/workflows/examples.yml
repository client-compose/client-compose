name: examples

# The todo example: every composer passes the same suite over HTTP, and every client builds against
# the current library sources.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "examples/todo/**"
      - "composers/**"
      - "clients/typescript/**"
      - "shared/typescript/**"
      - "codegen/**"
      - ".github/workflows/examples.yml"

jobs:
  composers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composer: [go, ts]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile
      - name: The composer's own tests
        working-directory: examples/todo/composer-${{ matrix.composer }}
        run: |
          if [ "${{ matrix.composer }}" = go ]; then go vet ./... && go test ./...; else pnpm test; fi
      - name: Start it
        working-directory: examples/todo/composer-${{ matrix.composer }}
        run: |
          if [ "${{ matrix.composer }}" = go ]; then go build -o /tmp/composer . && (/tmp/composer &); else (pnpm start &); fi
          for _ in $(seq 1 50); do curl -s -o /dev/null localhost:8080 && break; sleep 0.2; done
      - name: The shared suite, over HTTP
        working-directory: examples/todo/tests
        run: pnpm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/todo/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build # typecheck + vite build

  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (type-check, compile Server Components and client bundles)
        run: pnpm --filter todo-next-example build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/todo/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Bundle for iOS and Android with Metro
        run: npx expo export --platform ios --platform android
        env:
          CI: 1
